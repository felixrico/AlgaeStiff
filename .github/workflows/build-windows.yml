name: Build Windows executable

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path 'requirements.txt') { pip install -r requirements.txt }
          pip install pyinstaller

      - name: Build exe with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed merge_tvs_ting_plot_GUI.py --name DataPlotter

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install -y nsis

      - name: Create NSIS installer
        shell: pwsh
        run: |
          $nsi = @'
          OutFile "DataPlotter_Installer.exe"
          Name "DataPlotter"
          InstallDir "$PROGRAMFILES64\\DataPlotter"
          SetOutPath "$INSTDIR"
          File "dist\\DataPlotter.exe"
          CreateShortCut "$SMPROGRAMS\\DataPlotter.lnk" "$INSTDIR\\DataPlotter.exe"
          SectionEnd
          '@
          $nsi | Out-File -FilePath installer.nsi -Encoding ASCII
          makensis installer.nsi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataPlotter-windows
          path: |
            dist/DataPlotter.exe
            DataPlotter_Installer.exe
